<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Sync</title>
<style>
  @font-face { font-family: 'Archivo'; src: url(fonts/archivo.woff2) format('woff2');
    font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: 'Archivo'; src: url(fonts/archivo-italic.woff2) format('woff2');
    font-style: italic; font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: 'League Gothic'; src: url(fonts/league-gothic.woff2) format('woff2'); }
  @font-face { font-family: 'Alfa Slab One'; src: url(fonts/alfa-slab-one.woff2) format('woff2'); }
  @font-face { font-family: 'Josefin Sans'; src: url(fonts/josefin-sans.woff2) format('woff2'); font-weight: 100 700; }
  @font-face { font-family: 'Caveat'; src: url(fonts/caveat.woff2) format('woff2'); font-weight: 400 700; }
  @font-face { font-family: 'Permanent Marker'; src: url(fonts/permanent-marker.woff2) format('woff2'); }

  :root { --accent: #e8d44d; --bg: #000; }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); color: var(--accent); overflow: hidden; user-select: none;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  header { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 20px;
    padding: 32px 40px; transition: opacity .5s; z-index: 1; }
  header.hidden { opacity: 0; }
  #art { width: 88px; height: 88px; border-radius: 14px; object-fit: cover; box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 22%, transparent); }
  /* The title block stays left of the open notch (and so inside the border light's dip): long titles wrap to a
     compact block of at most 2 lines instead of running under the notch. 172px = padding + art + gap + margin. */
  header > div { min-width: 0; max-width: calc((100vw - var(--open-w, 780px)) / 2 - 172px); }
  #title, #artist { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  #title { font-size: 26px; font-weight: 600; line-height: 1.2; -webkit-line-clamp: 2; }
  #artist { -webkit-line-clamp: 1; }
  /* Narrow window (phone-sized): no room beside the open notch, so the header sits just below the closed notch,
     a bit smaller, and fades out while the notch is open instead of being covered by it */
  .narrow header { padding: 46px 24px 0; gap: 14px; }
  .narrow.notch-open header { opacity: 0; }
  .narrow header > div { max-width: none; }
  .narrow #art { width: 64px; height: 64px; border-radius: 12px; }
  .narrow #title { font-size: 21px; }
  #artist { font-size: 15px; opacity: .6; margin-top: 4px; }
  #title, #artist, #cover .t, #cover .a { transition: color .6s; }
  #status, #toast { position: fixed; left: 0; right: 0; text-align: center; font-size: 14px; z-index: 2; }
  #status { bottom: 32px; opacity: .45; }
  #toast { top: 28px; opacity: 0; transition: opacity .3s; }
  #toast.on { opacity: .8; }
  /* Views: "both" = one screen; with two screens one window is "stars", the other "cover". */
  body { animation: fadein .8s; transition: opacity .7s; }
  @keyframes fadein { from { opacity: 0; } }
  body.view-gone { opacity: 0; }
  .view-stars header, .view-cover header { opacity: 0 !important; }
  #cover { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3vh; opacity: 0; transform: scale(.96); transition: opacity .8s, transform .8s; pointer-events: none; }
  .view-cover #cover { opacity: 1; transform: none; }
  #cover img { height: 52vh; aspect-ratio: 1; border-radius: 28px; object-fit: cover;
    box-shadow: 0 0 80px color-mix(in srgb, var(--accent) 30%, transparent); }
  #cover .t { font-size: clamp(28px, 3.6vw, 64px); font-weight: 600; text-align: center; padding: 0 5vw; }
  #cover .a { font-size: clamp(16px, 1.6vw, 28px); opacity: .6; margin-top: -1.5vh; }

  /* Top bar and cover screen in each look's lettering */
  [data-look=pulse] #title, [data-look=pulse] #cover .t { font-family: Archivo; font-stretch: 125%; font-weight: 900;
    text-transform: uppercase; }
  [data-look=pulse] #artist, [data-look=pulse] #cover .a { font-family: Archivo; font-stretch: 125%; font-weight: 800;
    text-transform: uppercase; letter-spacing: .06em; font-size: 12px; }
  [data-look=pulse] #cover .a { font-size: clamp(13px, 1.1vw, 20px); }
  [data-look=pop] #title, [data-look=pop] #cover .t { font-family: 'League Gothic'; font-weight: 400; font-size: 40px;
    text-transform: uppercase; letter-spacing: .02em; }
  [data-look=pop] #cover .t { font-size: clamp(48px, 6vw, 110px); }
  [data-look=pop] #artist, [data-look=pop] #cover .a { font-family: 'Caveat'; font-weight: 700; font-size: 22px; opacity: .8; }
  [data-look=pop] #cover .a { font-size: clamp(24px, 2.2vw, 40px); }
  [data-look=ink] #title, [data-look=ink] #cover .t { font-family: 'Permanent Marker'; text-transform: uppercase; font-weight: 400; }
  [data-look=ink] #artist, [data-look=ink] #cover .a { font-family: 'Permanent Marker'; text-transform: uppercase; font-size: 14px; }
  [data-look=ink] #cover .a { font-size: clamp(16px, 1.4vw, 26px); }
  [data-look=atlas] #title, [data-look=atlas] #cover .t { font-family: Bahnschrift, 'Segoe UI', sans-serif; font-weight: 700;
    font-stretch: 75%; text-transform: uppercase; letter-spacing: .02em; }
  [data-look=atlas] #artist, [data-look=atlas] #cover .a { font-family: Bahnschrift, 'Segoe UI', sans-serif; font-weight: 300;
    text-transform: uppercase; letter-spacing: .2em; }
  [data-look=ink] #art, [data-look=pop] #art { border-radius: 6px; }

  /* The notch: a black pill at the top center that opens, on hover, into the look and color pickers. The black shape
     is drawn in the canvas (drawNotch) and moved by a spring; this element is only the panel of chips, a fixed size,
     fading in and out, so opening the notch never relayouts or repaints the page. */
  #notch { position: fixed; top: 0; left: 50%; z-index: 5; width: var(--open-w, 780px); transform: translateX(-50%);
    color: #fff; pointer-events: none; font: 500 13px "Segoe UI Variable Text", "Segoe UI", sans-serif; }
  #notch.open { pointer-events: auto; }
  /* --top-inset: the phone's status-bar strip (set by the Android app); the options sit below it, where taps reach us */
  #notch .in { display: grid; gap: 12px; padding: calc(16px + var(--top-inset, 0px)) 18px 16px; opacity: 0; transition: opacity .18s; }
  #notch.open .in { opacity: 1; transition: opacity .3s .12s; }
  #notch .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  #notch:not(.colors) #colors { display: none; }
  .phone #looks { display: none; }
  .chip { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 99px; background: #1c1c1c;
    cursor: pointer; white-space: nowrap; transition: background .25s, color .25s, box-shadow .25s; }
  .chip:hover { background: #2c2c2c; }
  .chip.on { background: #fff; color: #000; }
  .chip.cur { box-shadow: inset 0 0 0 1.5px #fff; }   /* the look showing while mixing */
  .chip.plain { padding: 5px 14px; }
  .chip i { width: 20px; height: 20px; border-radius: 50%; }
  .dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; transition: transform .2s, box-shadow .25s; }
  .dot:hover { transform: scale(1.15); }
  .dot.on { box-shadow: 0 0 0 2px #000, 0 0 0 4px #fff; }

  /* The cursor: a soft glow in the look's color instead of the arrow; fades after 2 s still */
  html, body, * { cursor: none !important; }
  #cursor { position: fixed; left: 0; top: 0; z-index: 10; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%;
    pointer-events: none; opacity: 0; transition: opacity .35s, scale .25s; will-change: translate;
    background: radial-gradient(circle, #fff 0 16%, var(--accent) 32%, color-mix(in srgb, var(--accent) 35%, transparent) 50%, transparent 70%); }
  #cursor.on { opacity: .95; }
  #cursor.big { scale: 1.5; }
</style>
</head>
<body>
<canvas></canvas>
<header class="hidden"><img id="art" alt=""><div><div id="title"></div><div id="artist"></div></div></header>
<div id="cover"><img alt=""><div class="t"></div><div class="a"></div></div>
<div id="status"></div>
<div id="toast"></div>
<div id="notch"><div class="in"><div class="row" id="looks"></div><div class="row" id="colors"></div></div></div>
<div id="cursor"></div>
<script>
// ---------- shared by every look ----------
const LOOKS = [];      // each ui/looks/*.js file adds one entry; the app shows one look per song, in order
const WIN = +new URLSearchParams(location.search).get('win') || 0;   // 0 = main window, 1 = second screen
let view = WIN ? 'cover' : 'both';     // both | stars | cover | gone
document.body.className = 'view-' + view;
let TOP = 150;         // the lyrics stay below this; slides to 40 when the header moves to the other screen
let headerH = 0;       // the header's height, kept by a ResizeObserver (no layout reads while drawing)
let sceneFade = 1;     // lyrics opacity; 0 on the cover screen

const $ = s => document.querySelector(s);
const cv = $('canvas'), ctx = cv.getContext('2d');
let W, H;
function resize() {
  const d = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight; cv.width = Math.round(W * d); cv.height = Math.round(H * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  LOOKS.forEach(l => l.resize && l.resize());
}
addEventListener('resize', resize);

let api, rev = -1, track = { id: -1, words: [], phrases: [] };
let clock = { pos: 0, at: performance.now(), playing: false };
let offset = 0, fs = true;

const now = () => performance.now() / 1000;   // real time: the mouse, the notch, crossfades
let sceneT = 0, rate = 1;   // the looks' clock: runs at a tenth of the speed while the music is paused
const songTime = () => clock.pos + (clock.playing ? (performance.now() - clock.at) / 1000 : 0) + offset;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, f) => a + (b - a) * f;
const easeOut = p => 1 - Math.pow(1 - clamp(p, 0, 1), 3);
const easeInOut = p => { p = clamp(p, 0, 1); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const backOut = p => { p = clamp(p, 0, 1) - 1; return 1 + 2.7 * p * p * p + 1.7 * p * p; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const stage = () => ({ x: 0, y: TOP, w: W, h: H - TOP, cx: W / 2, cy: TOP + (H - TOP) / 2 });

// ---------- smooth timing: the same motion at 60, 144 or 180 Hz ----------
let dt = 1 / 60;   // seconds since the last frame (capped)
// k60 = how much of the way to its target something moves per frame at 60 fps; scaled to the real frame time
const ease = k60 => 1 - Math.pow(1 - k60, dt * 60);

// ---------- glow sprites: a soft round glow drawn once and pasted (shadowBlur is a GPU blur pass per draw) ----------
const sprites = new Map();
function glowSprite(color, r) {
  r = Math.max(4, Math.round(r / 4) * 4);
  const k = color + r;
  let c = sprites.get(k);
  if (!c) {
    if (sprites.size > 300) sprites.clear();   // colors blend over time: keep the cache small
    c = document.createElement('canvas'); c.width = c.height = 2 * r;
    const g = c.getContext('2d'), gr = g.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, color); gr.addColorStop(0.25, color); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalAlpha = 1; g.fillStyle = gr; g.fillRect(0, 0, 2 * r, 2 * r);
    sprites.set(k, c);
  }
  return c;
}
function glowAt(x, y, r, color, a) {
  if (a <= 0.004) return;
  ctx.globalAlpha = a; ctx.drawImage(glowSprite(color, r), x - r, y - r, 2 * r, 2 * r);
}
// Glowing text: a word's blurred halo, rendered once at 64 px and scaled to any size, then pasted under the crisp text.
const halos = new Map();
function drawHalo(s, font, px, color, blur, x, y, align, baseline, a) {   // font: px => CSS font string
  if (a <= 0.004 || !s) return;
  const B = 64, sc = px / B, k = s + '|' + font(B) + '|' + color + '|' + blur;
  let c = halos.get(k);
  if (!c) {
    if (halos.size > 200) halos.clear();
    const g0 = document.createElement('canvas').getContext('2d');
    g0.font = font(B); const m = g0.measureText(s);
    const pad = Math.ceil(blur * 2), asc = m.fontBoundingBoxAscent, desc = m.fontBoundingBoxDescent;
    c = document.createElement('canvas'); c.width = Math.ceil(m.width) + pad * 2; c.height = Math.ceil(asc + desc) + pad * 2;
    const g = c.getContext('2d');
    g.font = font(B); g.textBaseline = 'alphabetic'; g.fillStyle = g.shadowColor = color; g.shadowBlur = blur;
    g.fillText(s, pad, pad + asc);
    Object.assign(c, { pad, asc, desc, tw: m.width });
    halos.set(k, c);
  }
  const left = align === 'center' ? x - c.tw * sc / 2 : align === 'right' ? x - c.tw * sc : x;
  const base = baseline === 'bottom' ? y - c.desc * sc : baseline === 'middle' ? y + (c.asc - c.desc) * sc / 2 : y;
  ctx.globalAlpha = a;
  ctx.drawImage(c, left - c.pad * sc, base - (c.pad + c.asc) * sc, c.width * sc, c.height * sc);
}

// Text as an image: outlined (stroked) text is re-traced on every draw, which is slow for big or rotated words, so it's
// rendered once (at the screen's pixel density, times res for text that gets zoomed) and pasted from then on.
const textImgs = new Map();
function textImage(s, font, style, res = 1) {   // style: { fill?, stroke?, lw?, stretch? }
  const d = (devicePixelRatio || 1) * res, k = [s, font, style.fill, style.stroke, style.lw, style.stretch, d].join('|');
  let c = textImgs.get(k);
  if (!c) {
    if (textImgs.size > 400) textImgs.clear();
    const g0 = document.createElement('canvas').getContext('2d');
    g0.font = font; if (style.stretch) g0.fontStretch = style.stretch;
    const m = g0.measureText(s), lw = style.lw || 0, pad = Math.ceil(lw) + 2;
    const asc = m.fontBoundingBoxAscent, desc = m.fontBoundingBoxDescent;
    c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil((m.width + pad * 2) * d)); c.height = Math.max(1, Math.ceil((asc + desc + pad * 2) * d));
    const g = c.getContext('2d');
    g.scale(d, d); g.font = font; if (style.stretch) g.fontStretch = style.stretch;
    g.lineJoin = 'round'; g.textBaseline = 'alphabetic';
    if (style.stroke) { g.lineWidth = lw; g.strokeStyle = style.stroke; g.strokeText(s, pad, pad + asc); }
    if (style.fill) { g.fillStyle = style.fill; g.fillText(s, pad, pad + asc); }
    c.meta = { pad, asc, desc, w: m.width, d };
    textImgs.set(k, c);
  }
  return c;
}
function drawText(c, x, y, align = 'left', baseline = 'alphabetic') {   // like fillText(s, x, y) for a textImage
  const { pad, asc, desc, w, d } = c.meta;
  const left = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  const base = baseline === 'middle' ? y + (asc - desc) / 2 : baseline === 'top' ? y + asc : baseline === 'bottom' ? y - desc : y;
  ctx.drawImage(c, left - pad, base - asc - pad, c.width / d, c.height / d);
}

// ---------- the mouse: every look reacts to it ----------
// x/y: where it is; sx/sy: a smoothed follower (what the scene reacts to, so everything springs instead of snapping);
// presence: 0..1, fades in while the mouse is over the window and recently moved, out when it leaves or rests.
const mouse = { x: -1, y: -1, sx: -1, sy: -1, speed: 0, at: 0, presence: 0, px: 0, py: 0, tilt: 0, inside: false };
addEventListener('pointermove', e => {
  const t = now(), d = Math.max(0.008, t - mouse.at);
  mouse.speed = mouse.at && t - mouse.at < 0.2 ? Math.min(3000, Math.hypot(e.clientX - mouse.x, e.clientY - mouse.y) / d) : 0;
  if (mouse.sx < 0) { mouse.sx = e.clientX; mouse.sy = e.clientY; }
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.at = t; mouse.inside = true;
});
document.addEventListener('pointerleave', () => { mouse.inside = false; });
addEventListener('blur', () => { mouse.inside = false; });
function stepMouse() {
  if (mouse.x < 0) return;
  const k = ease(0.22);
  mouse.sx += (mouse.x - mouse.sx) * k; mouse.sy += (mouse.y - mouse.sy) * k;
  if (now() - mouse.at > 0.1) mouse.speed *= 1 - ease(0.15);
  const want = mouse.inside && now() - mouse.at < 3 ? 1 : 0;   // rests for 3 s: the lyrics settle back
  mouse.presence += (want - mouse.presence) * ease(want > mouse.presence ? 0.12 : 0.04);
  const ox = clamp(mouse.sx / W - 0.5, -0.5, 0.5), oy = clamp(mouse.sy / H - 0.5, -0.5, 0.5);
  mouse.px = -ox * 28 * mouse.presence; mouse.py = -oy * 20 * mouse.presence;   // the scene leans away a little
  mouse.tilt = ox * 0.012 * mouse.presence;
}
// What's drawn at local (x, y) under the current transform: pushed away from the mouse (in screen pixels, so it
// works inside rotated or scaled layouts) and gently magnified, as a lens. Returns { dx, dy, s } in local units.
const NO_WARP = { dx: 0, dy: 0, s: 1, f: 0 };
function field(x, y, k = 1) {
  if (mouse.presence < 0.01) return NO_WARP;
  const m = ctx.getTransform(), d = devicePixelRatio || 1;
  const sx = (m.a * x + m.c * y + m.e) / d, sy = (m.b * x + m.d * y + m.f) / d;
  const ex = sx - mouse.sx, ey = sy - mouse.sy, r = Math.hypot(ex, ey), R = 170;
  if (r > R * 2) return NO_WARP;
  const f = Math.exp(-(r * r) / (R * R)) * mouse.presence * k;
  const push = 42 * f * Math.min(1, r / 40) / Math.max(r, 1);   // screen px, away from the mouse
  const ox = ex * push, oy = ey * push;
  const a = m.a / d, b = m.b / d, c = m.c / d, e = m.d / d, det = a * e - b * c || 1;
  return { dx: (e * ox - c * oy) / det, dy: (-b * ox + a * oy) / det, s: 1 + 0.28 * f, f };
}
function warp(x, y, k = 1) {   // call inside save(), right before drawing something centered on (x, y)
  const w = field(x, y, k);
  if (w === NO_WARP) return w;
  ctx.translate(x + w.dx, y + w.dy); ctx.scale(w.s, w.s); ctx.translate(-x, -y);
  return w;
}
// Backgrounds drawn at a smaller depth move less with the mouse than the lyrics: depth 0 = fixed, 1 = with the text.
function parallax(depth) { ctx.translate(-mouse.px * (1 - depth), -mouse.py * (1 - depth)); }

// Seeded randomness, so a phrase gets the same layout every time it's shown (e.g. after seeking back).
function hash(s) { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pickR = (r, arr) => arr[Math.floor(r() * arr.length)];

// How far a word is into being sung: 0 before, 1 a moment after it starts.
const sung = (wd, t, dur = 0.15) => clamp((t - wd.t) / dur, 0, 1);
const caps = s => s.toUpperCase();

// Largest font size (px) at which `text` fits maxW, capped at maxPx. font(px) returns a CSS font string.
function fitPx(text, font, maxW, maxPx, stretch) {
  ctx.font = font(100);
  if (stretch) ctx.fontStretch = stretch;
  const w = ctx.measureText(text).width || 1;
  ctx.fontStretch = 'normal';
  return Math.min(maxPx, 100 * maxW / w);
}
function textW(text, font, stretch) {
  ctx.font = font; if (stretch) ctx.fontStretch = stretch;
  const w = ctx.measureText(text).width;
  ctx.fontStretch = 'normal';
  return w;
}

// A tile of random grain for film / paper textures.
function noiseTile(size, light, alpha) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), img = g.createImageData(size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = light ? 255 : 0;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = Math.random() * 255 * alpha;
  }
  g.putImageData(img, 0, 0);
  return c;
}

// Full-screen layers that never change (gradients, vignettes) are drawn once per screen size and reused:
// a big gradient fill costs ~9 ms a frame, pasting the cached image almost nothing.
const layers = new Map();
function layer(key, draw) {
  const k = `${key}@${W}x${H}`;
  let c = layers.get(k);
  if (!c) { c = document.createElement('canvas'); c.width = W; c.height = H; draw(c.getContext('2d')); layers.set(k, c); }
  return c;
}

// Album art as an <img>, reloaded only when it changes (looks use it for title cards).
const artImg = new Image();
let artSrc = null;
function art() {
  if (track.art !== artSrc) { artSrc = track.art; if (artSrc) artImg.src = artSrc; }
  return artSrc && artImg.complete && artImg.naturalWidth ? artImg : null;
}

// Lyrics -> phrases: one per lyric line, long lines split into balanced chunks of at most 9 words.
function phrasesOf(ws) {
  const lines = []; let cur = [];
  ws.forEach((w, i) => { cur.push(w); if (w.end || i === ws.length - 1) { lines.push(cur); cur = []; } });
  const out = [];
  for (const ln of lines) {
    const parts = Math.ceil(ln.length / 9), size = Math.ceil(ln.length / parts);
    for (let i = 0; i < ln.length; i += size) out.push(ln.slice(i, i + size));
  }
  return out.map((words, i) => ({
    i, words, t0: words[0].t, tEnd: words[words.length - 1].t,
    t1: i + 1 < out.length ? out[i + 1][0].t : words[words.length - 1].t + 4,
  }));
}

// The phrase director for the kinetic-typography looks: which phrase (or the title card) is on screen,
// with the previous one kept briefly for its exit animation.
const LEAD = 0.3;   // a phrase is laid out this long before its first word is sung
const GAP = 6;      // an instrumental gap longer than this brings the title card back
function direct(lk, T) {
  const t = songTime(), P = track.phrases;
  let k = -1;
  for (let lo = 0, hi = P.length - 1; lo <= hi;) {
    const m = (lo + hi) >> 1;
    if (P[m].t0 - LEAD <= t) { k = m; lo = m + 1; } else hi = m - 1;

  const ph = P[k];
  const card = !ph || (t > ph.tEnd + 2.5 && ph.t1 - ph.tEnd > GAP && ph.t1 - t > 1.2);
  const key = (card ? 'card' : 'ph') + k;
  const st = lk.st || (lk.st = {});
  if (!st.cur || st.cur.key !== key || st.cur.W !== W || st.cur.TOP !== Math.round(TOP)) {
    const resized = st.cur && st.cur.key === key;
    if (st.cur && !resized) { st.prev = st.cur; st.prev.out = T; }
    st.cur = { key, k, card, ph, at: resized ? st.cur.at : T, W, TOP: Math.round(TOP), r: rng(hash(track.title + ':' + key)) };
    st.cur.L = card ? lk.buildCard(st.cur) : lk.build(ph, st.cur.r, st.cur);
    if (!resized && lk.enter) lk.enter(st.cur, st.prev, T);
  }
  if (st.prev && T - st.prev.out > lk.exit) st.prev = null;
  return { t, cur: st.cur, prev: st.prev };
}

// ---------- the look manager ----------
let look = -1, lookSaved = null;
const ghost = document.createElement('canvas');   // last frame of the old look/style, faded out over the new one
let ghostAt = -9;
function snapshot() {
  ghost.width = cv.width; ghost.height = cv.height; ghost.getContext('2d').drawImage(cv, 0, 0); ghostAt = now();
}
let lookWant = 0;   // the look asked for (song turn, notch, N key); a phone shows Constellation whatever it is
const isPhone = () => window.MOBILE_APP || innerWidth < 700;   // MOBILE_APP: set by the Android app's android.js
function setLook(i) {
  i = (((Number(i) || 0) % LOOKS.length) + LOOKS.length) % LOOKS.length;   // never NaN: that would blank the screen
  lookWant = i;
  if (isPhone()) i = Math.max(0, LOOKS.findIndex(l => l.id === 'constellation'));
  if (i === look) return LOOKS[i];
  if (look >= 0) snapshot();
  look = i;
  const lk = LOOKS[i];
  document.documentElement.dataset.look = lk.id;
  lk.st = null;
  if (lk.reset) lk.reset();
  return lk;
}
function setAccent(c) {
  if (c && c !== setAccent.last) document.documentElement.style.setProperty('--accent', setAccent.last = c);
}

let lastTs = 0;
function frame(ts) {
  dt = lastTs ? clamp((ts - lastTs) / 1000, 0, 0.05) : 1 / 60; lastTs = ts;
  const lk = setLook(lookWant);   // also switches to/from Constellation when the window crosses phone width
  stepMouse(); stepNotch(lk);                                  // these keep real speed; the looks below get slowed dt
  rate += ((clock.playing ? 1 : 0.1) - rate) * ease(0.04);
  dt *= rate; sceneT += dt;
  const T = sceneT;
  if (lk.pre) lk.pre(T);                                       // may snapshot this frame for a crossfade
  if (cv.width !== Math.round(innerWidth * (devicePixelRatio || 1))) resize();   // moved to a screen with other scaling
  ctx.setTransform(devicePixelRatio || 1, 0, 0, devicePixelRatio || 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.shadowBlur = 0;
  ctx.clearRect(0, 0, W, H);
  const topWant = view === 'both' ? Math.max(150, headerH - 16) : 40;   // below a 2-line title too (header has 32px padding)
  TOP += (topWant - TOP) * ease(0.05);                          // smooth slide when the layout changes
  if (Math.abs(topWant - TOP) < 0.3) TOP = topWant;              // land exactly: layouts are rebuilt while it moves
  sceneFade += ((view === 'cover' ? 0 : 1) - sceneFade) * ease(0.06);
  if (W >= 300 && H >= TOP + 150) {                            // minimized or tiny: wait until there's room
    ctx.save();
    if (mouse.presence > 0.001) {   // the whole scene leans with the mouse; slight overscan so no edge shows
      const s = 1 + 0.035 * mouse.presence;
      ctx.translate(W / 2 + mouse.px, H / 2 + mouse.py); ctx.rotate(mouse.tilt); ctx.scale(s, s); ctx.translate(-W / 2, -H / 2);
    }
    lk.frame(T);
    ctx.restore();
    if (lk.overlay) { ctx.save(); lk.overlay(T); ctx.restore(); }   // screen-fixed extras (the border light)
  }
  if (now() - ghostAt < 0.8) {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1 - (now() - ghostAt) / 0.8; ctx.drawImage(ghost, 0, 0);
    ctx.restore();
  }
  drawNotch();
  requestAnimationFrame(frame);
}

// ---------- talking to app.py ----------

function showTrack(t) {
  const h = $('header');
  h.classList.add('hidden');
  // "(with X & Y)" / "(feat. X)" repeat the artist line: dropped so the title fits its corner
  const title = t.title.replace(/\s*[(\[](with|feat\.?|ft\.?|featuring)\s[^)\]]*[)\]]/gi, '');
  setTimeout(() => {
    $('#title').textContent = title;
    $('#artist').textContent = t.artist;
    $('#cover .t').textContent = title;
    $('#cover .a').textContent = t.artist;
    for (const img of [$('#art'), $('#cover img')]) {
      img.style.display = t.art ? '' : 'none';
      if (t.art) img.src = t.art;
    }
    h.classList.toggle('hidden', !t.title);
  }, 400);
}

async function poll() {
  try {
    const s = lastState = await api.state();
    clock = { pos: s.pos, at: performance.now(), playing: s.playing };
    $('#status').textContent = s.status;
    view = !s.dual ? (WIN ? 'gone' : 'both') : (WIN === s.stars_on ? 'stars' : 'cover');
    document.body.className = 'view-' + view;
    if (now() - pickedAt > 0.8) {   // just picked here: this answer may predate the pick
      if (s.look !== lookSaved) { lookSaved = s.look; setLook(s.look); }   // new song, N key, notch, or the other screen
      LOOKS.forEach(l => l.poll && l.poll(s));
      lockNow = s.lock; colorNow = s.color;
    }
    markNotch();
    if (s.rev !== rev) {
      rev = s.rev;
      const t = await api.track();
      if (t.id === track.id && t.words.length && t.words.length === track.words.length && t.words.every((w, i) => w.w === track.words[i].w)) {
        // same words, times heard by the app's listener: move them in place, so nothing on screen is laid out again
        t.words.forEach((w, i) => { track.words[i].t = w.t; });
        track.phrases.forEach(ph => { ph.t0 = ph.words[0].t; ph.tEnd = ph.words[ph.words.length - 1].t; });
        track.phrases.forEach((ph, i, P) => { ph.t1 = i + 1 < P.length ? P[i + 1].t0 : ph.tEnd + 4; });
        return;
      }
      t.phrases = phrasesOf(t.words);
      const changed = t.id !== track.id;
      if (changed || t.title !== track.title || t.art !== track.art) showTrack(t);
      track = t;
      if (changed) LOOKS.forEach(l => { l.st = null; if (l.reset) l.reset(); });
      else LOOKS.forEach(l => { l.st = null; });   // lyrics arrived: lay the phrases out again
    }
  } catch (e) { console.error(e); }
}
addEventListener('pywebviewready', () => { api = pywebview.api; poll(); setInterval(poll, 250); });

// ---------- the notch: stay on one look or mix them (a new one every song), and Constellation's color ----------
const SWATCH = { constellation: 'radial-gradient(circle at 60% 40%, #E8D44D 0 22%, #111 26%)',
                 pulse: 'linear-gradient(135deg, #FF1F8E, #F6C4DA 55%, #2A0F1C)',
                 pop: 'conic-gradient(#CC1A4A 0 33%, #3FF0C3 0 66%, #EECB5B 0)',
                 ink: 'linear-gradient(135deg, #EEEBE3 50%, #1A1916 50%)',
                 atlas: 'linear-gradient(135deg, #0F5A52, #04201D 55%, #C8DE78)' };
let lockNow = -1, colorNow = -1, pickedAt = -9, lastState = {};
function buildNotch() {
  $('#looks').innerHTML = '<div class="chip plain" data-i="-1">Mix</div>' + LOOKS.map((l, i) =>
    `<div class="chip" data-i="${i}"><i style="background:${SWATCH[l.id] || '#444'}"></i>${l.name}</div>`).join('');
  $('#colors').innerHTML = '<div class="chip plain" data-c="-1">Cycle</div>' + PALETTE.map((c, i) =>
    `<div class="dot" data-c="${i}" style="background:${c}" title="${c}"></div>`).join('');
  $('#looks').onclick = e => { const el = e.target.closest('[data-i]'); if (el) pickLook(+el.dataset.i); };
  $('#colors').onclick = e => {
    const el = e.target.closest('[data-c]');
    if (!el) return;
    pickedAt = now(); colorNow = +el.dataset.c;
    LOOKS.forEach(l => l.poll && l.poll({ ...lastState, color: colorNow }));   // blend now, not on the next poll
    api.set_color(colorNow); markNotch();
  };
}
function pickLook(i) {   // -1 = mix
  pickedAt = now(); lockNow = i;
  if (i >= 0) { lookSaved = i; setLook(i); }   // the old look crossfades into the new one
  api.set_lock(i); markNotch();
}
// The notch's motion: a spring stepped every frame (no CSS size transitions, no layout reads while drawing).
// The border light reads the same numbers to dip around it (notchShape).
const notch = { w: 180, h: 26, r: 16, y: 0, vw: 0, vh: 0, vr: 0, vy: 0, open: false, away: false, idleAt: now(),
                openW: 780, openH: 110 };
function measureNotch() {   // the open panel's size: measured only when its contents change, never per frame
  notch.openW = Math.min(780, innerWidth * 0.96);
  document.documentElement.classList.toggle('phone', isPhone());   // phone: no look chips, only the colors
  document.documentElement.style.setProperty('--open-w', notch.openW + 'px');   // the notch and the header both use it
  notch.openH = Math.ceil($('#notch .in').offsetHeight);
  // under ~160px left for the title beside the open notch: put the header below it instead
  document.documentElement.classList.toggle('narrow', (innerWidth - notch.openW) / 2 - 172 < 160);
}
addEventListener('resize', measureNotch);
function stepNotch(lk) {
  const t = now();
  if (!notch.open && !notch.away && t - notch.idleAt > 5    // idle 5 s: hide, but let the border light finish going
      && (!(lk.busyNotch && lk.busyNotch()) || t - notch.idleAt > 6.5)) notch.away = true;   // round it first
  const th = notch.open ? notch.openH : 26;
  const want = { w: notch.open ? notch.openW : 180, h: th, r: notch.open ? 30 : 16, y: notch.away ? -(th + 14) : 0 };
  for (let rem = dt; rem > 1e-4;) {   // a slightly bouncy spring, in small steps so it is the same at any frame rate
    const h = Math.min(rem, 1 / 240); rem -= h;
    for (const p of ['w', 'h', 'r', 'y']) {
      const v = 'v' + p;

function drawNotch() {   // the black shape itself, on top of everything in the canvas
  const s = notchShape();
  if (!s) return;
  ctx.save(); ctx.setTransform(devicePixelRatio || 1, 0, 0, devicePixelRatio || 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.roundRect(s.x0, notch.y - 2, s.x1 - s.x0, s.y1 - notch.y + 2, [0, 0, s.rb, s.rb]); ctx.fill();

function setNotchOpen(open) {

  $('#notch').classList.toggle('open', open); cursorEl.classList.toggle('big', open);
  document.documentElement.classList.toggle('notch-open', open);
}
function notchShape() {   // the notch as the border light sees it, or null when it's slid away
  const y1 = notch.y + notch.h;
  if (y1 < 16) return null;
  return { x0: W / 2 - notch.w / 2, x1: W / 2 + notch.w / 2, y1, rb: Math.max(0, Math.min(notch.r, notch.h / 2, notch.w / 2)) };
}
function markNotch() {
  const id = LOOKS[look] && LOOKS[look].id, colors = id === 'constellation';
  if (colors !== $('#notch').classList.contains('colors')) { $('#notch').classList.toggle('colors', colors); measureNotch(); }
  document.querySelectorAll('#looks .chip').forEach(el => {
    const i = +el.dataset.i;
    el.classList.toggle('on', i === lockNow || (i === -1 && lockNow < 0));
    el.classList.toggle('cur', lockNow < 0 && i === look);
  });
  document.querySelectorAll('#colors [data-c]').forEach(el => el.classList.toggle('on', +el.dataset.c === colorNow));
}

let toastTimer;
function toast(msg) {
  $('#toast').textContent = msg; $('#toast').classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').classList.remove('on'), 1200);
}

addEventListener('keydown', e => {
  if (e.key === 'F12' || e.key === 'F11' || (e.key === 'Escape' && fs)) {
    e.preventDefault(); fs = !fs; api.fullscreen(WIN); return;
  }
  if (e.key === ' ') { e.preventDefault(); toast(clock.playing ? 'Paused' : 'Playing'); api.play_pause(); return; }
  if (e.key === 'd' || e.key === 'D') { api.toggle_dual().then(toast); return; }
  if (e.key === 's' || e.key === 'S') { api.swap().then(toast); return; }
  if ((e.key === 'n' || e.key === 'N') && lockNow >= 0) { pickLook((look + 1) % LOOKS.length); toast(`Look: ${LOOKS[look].name}`); return; }
  if (e.key === 'n' || e.key === 'N') {
    pickedAt = now();
    lookSaved = (lookSaved || 0) + 1;
    const lk = setLook(lookSaved);
    toast(`Look ${look + 1}: ${lk.name}`);
    api.next_look();
    return;
  }
  if (LOOKS[look] && LOOKS[look].key && LOOKS[look].key(e)) return;
  if (e.key === 'ArrowRight') offset += 0.1;
  else if (e.key === 'ArrowLeft') offset -= 0.1;
  else if (e.key === '0') offset = 0;
  else return;
  offset = Math.round(offset * 10) / 10;
  toast(offset ? `Lyrics ${offset > 0 ? 'earlier' : 'later'} by ${Math.abs(offset).toFixed(1)} s` : 'Lyrics timing reset');
});
</script>
<!-- One file per look; the order here is the order songs take turns in. Delete a line to drop a look. -->
<script src="looks/constellation.js"></script>
<script src="looks/pulse.js"></script>
<script src="looks/pop.js"></script>
<script src="looks/ink.js"></script>
<script src="looks/atlas.js"></script>
<script>
resize();
buildNotch();
new ResizeObserver(([e]) => { headerH = e.target.offsetHeight; }).observe($('header'));
measureNotch();
const cursorEl = $('#cursor');
let cursorTimer;
addEventListener('pointermove', e => {   // the glow cursor follows straight from the event (lowest lag), fades when still
  cursorEl.style.translate = `${e.clientX}px ${e.clientY}px`;   // not transform: `scale` (.big) would scale the offset too
  cursorEl.classList.add('on');
  clearTimeout(cursorTimer); cursorTimer = setTimeout(() => cursorEl.classList.remove('on'), 2000);
  notch.idleAt = now(); notch.away = false;   // any movement brings the notch back
});
addEventListener('pointermove', e => {   // hovering the notch's drawn shape opens it; leaving it closes it
  const s = notchShape(), m = notch.open ? 10 : 0;
  setNotchOpen(!!s && e.clientX > s.x0 - m && e.clientX < s.x1 + m && e.clientY < s.y1 + m);
});
// only a mouse leaving the window closes it: a finger "leaves" on every lift, before its tap's click lands on a chip
document.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') setNotchOpen(false); });
addEventListener('pointerdown', e => {   // touch has no hover: a tap on the notch (or where it hides) opens it, elsewhere closes
  if (e.pointerType === 'mouse') return;
  notch.idleAt = now(); notch.away = false;
  const s = notchShape() || { x0: W / 2 - 90, x1: W / 2 + 90, y1: 26 }, m = notch.open ? 10 : 16;
  setNotchOpen(e.clientX > s.x0 - m && e.clientX < s.x1 + m && e.clientY < s.y1 + m);
});
// Start drawing once the fonts are in, so the first layouts are measured with the real lettering.
Promise.race([
  Promise.all(['900 40px Archivo', 'italic 900 40px Archivo', '40px "League Gothic"', '40px "Alfa Slab One"',
               '700 40px "Josefin Sans"', '700 40px Caveat', '40px "Permanent Marker"'].map(f => document.fonts.load(f))),
  new Promise(r => setTimeout(r, 3000)),
]).then(() => requestAnimationFrame(frame));
</script>
