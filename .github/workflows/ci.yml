name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # the tested code (lyrics, cache, title cleanup) is standard library only, so the heavy runtime deps are skipped
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
